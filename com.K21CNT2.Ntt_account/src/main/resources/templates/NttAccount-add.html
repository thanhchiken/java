<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Thêm mới tài khoản</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #ccc; padding-top: 1rem;">
<section class="container bg-white my-1 p-3">
    <form th:action="@{/Accounts/add}" th:object="${account}" method="post">
        <div class="card">
            <div class="card-header">
                <h1 class="text-center">Thêm mới tài khoản</h1>
            </div>
            <div class="card-body">
                <div class="mb-3 row">
                    <label for="nttUser" class="col-sm-2 col-form-label">Tên đăng nhập</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="nttUser" th:field="*{nttUser}" required>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="nttPass" class="col-sm-2 col-form-label">Mật khẩu</label>
                    <div class="col-sm-10">
                        <input type="password" class="form-control" id="nttPass" th:field="*{nttPass}" required>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="nttName" class="col-sm-2 col-form-label">Họ tên</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="nttName" th:field="*{nttName}" required>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="nttEmail" class="col-sm-2 col-form-label">Email</label>
                    <div class="col-sm-10">
                        <input type="email" class="form-control" id="nttEmail" th:field="*{nttEmail}" required>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="nttPhone" class="col-sm-2 col-form-label">Số điện thoại</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="nttPhone" th:field="*{nttPhone}" required>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="nttAddress" class="col-sm-2 col-form-label">Địa chỉ</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="nttAddress" th:field="*{nttAddress}" required>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="nttStatus" class="col-sm-2 col-form-label">Trạng thái</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" id="nttStatus" th:field="*{nttStatus}" required>
                    </div>
                </div>
            </div>
            <div class="card-footer">
                <button class="btn btn-primary">Ghi lại</button>
                <a th:href="@{/Accounts/list}" class="btn btn-secondary">Trở lại</a>
            </div>
        </div>
    </form>
</section>
</body>
</html>
