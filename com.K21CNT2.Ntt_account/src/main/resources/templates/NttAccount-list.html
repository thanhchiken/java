<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Danh sách tài khoản</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #ccc; padding-top: 1rem;">
<section class="container bg-white my-1 p-3">
  <div class="card">
    <div class="card-header">
      <h1 class="text-center">Danh sách tài khoản</h1>
    </div>
    <div class="card-body">
      <table class="table table-borderless">
        <thead>
        <tr>
          <th>ID</th>
          <th>Tên đăng nhập</th>
          <th>Mật khẩu</th>
          <th>Họ tên</th>
          <th>Email</th>
          <th>Số điện thoại</th>
          <th>Địa chỉ</th>
          <th>Trạng thái</th>
          <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="account : ${accounts}">
          <td th:text="${account.id}"></td>
          <td th:text="${account.nttUser}"></td>
          <td th:text="${account.nttPass}"></td>
          <td th:text="${account.nttName}"></td>
          <td th:text="${account.nttEmail}"></td>
          <td th:text="${account.nttPhone}"></td>
          <td th:text="${account.nttAddress}"></td>
          <td th:text="${account.nttStatus}"></td>

          <td>
            <a th:href="@{/Accounts/edit/{id}(id=${account.id})}" class="btn btn-primary">Edit</a>
            <a th:href="@{/Accounts/delete/{id}(id=${account.id})}" class="btn btn-danger"
               onclick="return confirm('Bạn có chắc muốn xóa?')">Delete</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="card-footer">
      <a class="btn btn-success" th:href="@{/Accounts/add}">Thêm tài khoản</a>
    </div>
  </div>
</section>
</body>
</html>
